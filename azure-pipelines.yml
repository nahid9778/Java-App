trigger: none

pool: AppPool

stages:
  - stage: Build
    displayName: Build Java Login App
    jobs:
      - job: mvnpackage
        displayName: Build Java using MVN
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'mvn clean package'
        - task: PublishPipelineArtifact@1
          inputs:
            targetPath: '$(Build.SourcesDirectory)/target/JavaLoginShowcase-1.0.0.war'
            artifact: 'war_artifacts'
            publishLocation: 'pipeline'
  - stage: deploy
    jobs:
    - deployment: deployjava
      displayName: Deploy Java
      environment: Java VM
      strategy:
        runOnce:
          deploy:
            steps:
            - task: DownloadPipelineArtifact@2
              inputs:
                buildType: 'current'
                artifactName: 'war_artifacts'
                targetPath: '$(Pipeline.Workspace)'
            - task: CopyFilesOverSSH@0
              inputs:
                sshEndpoint: 'JavaSSH'
                sourceFolder: '$(Pipeline.Workspace)/war_artifacts'
                contents: '**'
                targetFolder: '/tmp'
                readyTimeout: '20000'
            - task: SSH@0
              inputs:
                sshEndpoint: 'JavaSSH'
                runOptions: 'inline'
                inline: |
                  sudo cp -r /tmp/*.war /var/lib/tomcat10/webapps
                  sudo chmod 777 /var/lib/tomcat10/webapps/*
                readyTimeout: '20000'
            
            
            